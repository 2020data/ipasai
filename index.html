<!DOCTYPE html>
<html lang="zh-Hant" data-theme="cute">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPAS AI 應用規劃師｜每日刷題與隨機大測驗</title>
  <style>
    /* ================= 雙主題配色系統 ================= */
    :root, [data-theme="cute"] {
      --bg: #fff5f8;
      --bg-pattern: radial-gradient(#fbcfe8 1.2px, transparent 1.2px);
      --card: #ffffff;
      --card-shadow: 0 8px 24px rgba(236, 72, 153, 0.10);
      --border: #fbcfe8;
      --text: #4a2545;
      --muted: #9d6b8e;
      --primary: #ec4899;
      --primary-hover: #db2777;
      --primary-grad: linear-gradient(135deg, #f472b6, #ec4899);
      --accent: #f59e0b;
      --accent-grad: linear-gradient(135deg, #fbbf24, #f97316);
      --stat-bg: #fff0f6;
      --chip-bg: #fdf2f8;
      --chip-done-bg: #dcfce7;
      --chip-done-border: #86efac;
      --chip-done-text: #166534;
      --input-bg: #ffffff;
      --radius-card: 22px;
      --radius-btn: 999px;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #e11d48;
      --danger-bg: #fff1f2;
    }

    [data-theme="cool"] {
      --bg: #0b1120;
      --bg-pattern: radial-gradient(#1e293b 1.2px, transparent 1.2px);
      --card: #131c31;
      --card-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      --border: #263554;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #06b6d4;
      --primary-hover: #0891b2;
      --primary-grad: linear-gradient(135deg, #06b6d4, #3b82f6);
      --accent: #8b5cf6;
      --accent-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
      --stat-bg: #0f172a;
      --chip-bg: #0f172a;
      --chip-done-bg: #064e3b;
      --chip-done-border: #10b981;
      --chip-done-text: #6ee7b7;
      --input-bg: #0f172a;
      --radius-card: 14px;
      --radius-btn: 10px;
      --success: #34d399;
      --success-bg: #064e3b;
      --danger: #fb7185;
      --danger-bg: #4c0519;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
      background-color: var(--bg);
      background-image: var(--bg-pattern);
      background-size: 22px 22px;
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.25s, color 0.25s;
    }
    .container { max-width: 820px; margin: 0 auto; padding: 20px 16px 70px; }
    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-card);
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: var(--card-shadow);
      transition: all 0.25s;
    }
    h1, h2, h3 { margin-top: 0; }
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 18px;
    }
    .theme-switch {
      display: flex; gap: 6px; background: var(--card);
      border: 1.5px solid var(--border); padding: 4px; border-radius: 999px;
    }
    .theme-btn {
      border: none; background: transparent; color: var(--muted);
      padding: 6px 12px; border-radius: 999px; cursor: pointer;
      font-size: 0.85rem; font-weight: 700; transition: 0.2s;
    }
    .theme-btn.active { background: var(--primary-grad); color: #fff; }
    .badge {
      display: inline-block; padding: 5px 12px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 700;
      background: var(--stat-bg); border: 1px solid var(--border); color: var(--primary);
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab-btn {
      flex: 1; padding: 10px; border: 1.5px solid var(--border); border-radius: var(--radius-btn);
      background: var(--stat-bg); color: var(--text); cursor: pointer; font-weight: 700; font-size: 1rem;
    }
    .tab-btn.active { background: var(--primary-grad); color: #fff; border-color: transparent; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.95rem; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
      border-radius: 12px; font-size: 1rem; background: var(--input-bg); color: var(--text);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 20px; border: none; border-radius: var(--radius-btn);
      background: var(--primary-grad); color: #fff; font-size: 0.98rem; font-weight: 700;
      cursor: pointer; transition: transform 0.12s, opacity 0.15s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.95; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-accent { background: var(--accent-grad); }
    .btn-outline {
      background: transparent; color: var(--text); border: 1.5px solid var(--border);
    }
    .btn-outline:hover:not(:disabled) { background: var(--stat-bg); }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
    .btn-full { width: 100%; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

    .msg {
      padding: 11px 14px; border-radius: 12px; margin-bottom: 14px;
      font-size: 0.95rem; font-weight: 600; display: none;
    }
    .msg.error { display: block; background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
    .msg.success { display: block; background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px;
    }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-box {
      background: var(--stat-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 8px; text-align: center;
    }
    .stat-num { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 0.82rem; color: var(--muted); font-weight: 600; }

    .q-block {
      border: 1.5px solid var(--border); border-radius: 14px;
      padding: 18px; margin-bottom: 16px; background: var(--stat-bg);
    }
    .q-title { font-weight: 700; margin-bottom: 12px; font-size: 1.05rem; }
    .opt-label {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px;
      margin-bottom: 8px; cursor: pointer; background: var(--card); transition: 0.12s;
    }
    .opt-label:hover { border-color: var(--primary); }
    .opt-label input { width: auto; margin-top: 4px; accent-color: var(--primary); }
    .opt-correct { background: var(--success-bg) !important; border-color: var(--success) !important; }
    .opt-wrong { background: var(--danger-bg) !important; border-color: var(--danger) !important; }
    .explanation {
      margin-top: 10px; padding: 12px; border-radius: 10px;
      background: var(--card); border-left: 4px solid var(--primary); font-size: 0.94rem;
    }

    .history-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px;
    }
    .day-chip {
      padding: 8px 4px; text-align: center; border-radius: 12px; font-size: 0.82rem;
      border: 1.5px solid var(--border); background: var(--chip-bg); color: var(--muted);
    }
    .day-chip.done {
      background: var(--chip-done-bg); border-color: var(--chip-done-border);
      color: var(--chip-done-text); font-weight: 700; cursor: pointer;
    }
    .day-chip.done:hover { transform: translateY(-2px); }

    .list-item {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
      gap: 8px; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--stat-bg); margin-bottom: 8px;
    }
    .err-pill {
      padding: 3px 10px; border-radius: 999px; font-size: 0.82rem; font-weight: 700;
      background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 頂部列 -->
    <div class="header-bar">
      <div>
        <h2 id="brandTitle" style="margin:0;">🌸 iPAS AI 每日刷題小教室</h2>
        <span style="font-size:0.88rem;color:var(--muted);">40 天 200 題・可重複練習・隨機 20 題模擬考・錯題統計</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="theme-switch">
          <button id="btnCute" class="theme-btn active" onclick="setTheme('cute')">🌸 少女風</button>
          <button id="btnCool" class="theme-btn" onclick="setTheme('cool')">⚡ 帥氣風</button>
        </div>
        <div id="userHeader" class="hidden" style="display:flex;align-items:center;gap:8px;">
          <span id="userBadge" class="badge"></span>
          <button class="btn btn-outline btn-sm" onclick="logout()">登出</button>
        </div>
      </div>
    </div>

    <!-- 登入 / 登記卡片 -->
    <div id="authView" class="card">
      <div class="tabs">
        <button id="tabLogin" class="tab-btn active" onclick="switchAuthTab('login')">考生登入</button>
        <button id="tabRegister" class="tab-btn" onclick="switchAuthTab('register')">新考生登記</button>
      </div>
      <div id="authMsg" class="msg"></div>
      <form id="authForm" onsubmit="submitAuth(event)">
        <div class="form-group">
          <label for="account">帳號（Email 或學號）</label>
          <input id="account" type="text" required placeholder="例如：student01@example.com" autocomplete="username" />
        </div>
        <div id="nameGroup" class="form-group hidden">
          <label for="name">考生姓名 / 暱稱</label>
          <input id="name" type="text" placeholder="請輸入姓名" />
        </div>
        <div class="form-group">
          <label for="password">密碼（至少 6 碼）</label>
          <input id="password" type="password" required minlength="6" placeholder="請輸入密碼" autocomplete="current-password" />
        </div>
        <button id="authSubmitBtn" type="submit" class="btn btn-full">登入開始練習</button>
      </form>
    </div>

    <!-- 主畫面 -->
    <div id="appView" class="hidden">
      <!-- 儀表板 -->
      <div class="card">
        <div class="stats-grid">
          <div class="stat-box">
            <div id="statDone" class="stat-num">0 / 40</div>
            <div class="stat-label">已解鎖天數</div>
          </div>
          <div class="stat-box">
            <div id="statRandomCount" class="stat-num">0 次</div>
            <div class="stat-label">隨機 20 題測驗</div>
          </div>
          <div class="stat-box">
            <div id="statAcc" class="stat-num">--%</div>
            <div class="stat-label">總累計正確率</div>
          </div>
          <div class="stat-box">
            <div id="statStatus" class="stat-num" style="font-size:1.05rem;">載入中</div>
            <div class="stat-label">今日狀態</div>
          </div>
        </div>
        <div id="appMsg" class="msg"></div>
        <div id="mainActionArea"></div>
      </div>

      <!-- 作答 / 詳解卡片 -->
      <div id="quizCard" class="card hidden">
        <div class="header-bar" style="margin-bottom:12px;">
          <h3 id="quizTitle" style="margin:0;"></h3>
          <div class="btn-row" style="margin:0;">
            <button id="retryFromReviewBtn" class="btn btn-sm hidden" onclick="retryReviewedDay()">🔄 重練這 5 題</button>
            <button id="closeQuizBtn" class="btn btn-outline btn-sm" onclick="closeQuizCard()">關閉</button>
          </div>
        </div>
        <div id="quizQuestions"></div>
        <button id="submitQuizBtn" class="btn btn-full hidden" onclick="submitQuiz()">交卷並儲存成績</button>
      </div>

      <!-- 個人最容易出錯的題目統計 -->
      <div class="card">
        <div class="header-bar" style="margin-bottom:10px;">
          <h3 style="margin:0;">🎯 我的最易錯題目排行榜</h3>
          <button id="reviewAllWrongBtn" class="btn btn-outline btn-sm hidden" onclick="openWeaknessReview()">一鍵複習 TOP 10 錯題</button>
        </div>
        <div id="weaknessList" style="font-size:0.95rem;color:var(--muted);">尚無錯題紀錄，繼續保持！</div>
      </div>

      <!-- 40 天進度牆 -->
      <div class="card">
        <h3>📅 40 天練習牆（點擊已完成天數可看詳解或重複練習）</h3>
        <div id="historyGrid" class="history-grid"></div>
      </div>

      <!-- 隨機 20 題大測驗歷史紀錄 -->
      <div class="card">
        <h3>🎲 隨機 20 題大測驗紀錄</h3>
        <div id="randomHistoryList" style="font-size:0.95rem;color:var(--muted);">尚未進行過隨機 20 題大測驗。</div>
      </div>
    </div>
  </div>

  <script>
    // ====== 請替換成你的 Google Apps Script 網址 ======
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzNqbVXuXqklYrLgovypwtgV0y4kzvh36y7hV9QLnCKofMzENXbJsAAovchSpzybXfd/exec';
    // ==================================================

    let authMode = 'login';
    let allQuestions = [];
    let qMap = {};
    let currentUser = null;

    let activeQuizMode = null; // 'daily' | 'retry' | 'random20'
    let activeQuizDay = 0;
    let activeQuestions = [];
    let reviewedDay = 0;

    window.addEventListener('DOMContentLoaded', async () => {
      const savedTheme = localStorage.getItem('ipas_theme') || 'cute';
      setTheme(savedTheme);

      try {
        const res = await fetch('./ipas_ai_40days_200q.json');
        if (!res.ok) throw new Error('無法載入題庫');
        allQuestions = await res.json();
        allQuestions.forEach(q => { qMap[q.id] = q; });
      } catch (err) {
        showMsg('authMsg', '題庫載入失敗，請確認 ipas_ai_40days_200q.json 已放在同一目錄。', 'error');
        return;
      }

      const savedToken = sessionStorage.getItem('ipas_token');
      if (savedToken) await restoreSession(savedToken);
    });

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('ipas_theme', theme);
      document.getElementById('btnCute').classList.toggle('active', theme === 'cute');
      document.getElementById('btnCool').classList.toggle('active', theme === 'cool');
      document.getElementById('brandTitle').textContent =
        theme === 'cute' ? '🌸 iPAS AI 每日刷題小教室' : '⚡ iPAS AI 極速刷題戰情室';
    }

    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('nameGroup').classList.toggle('hidden', mode === 'login');
      document.getElementById('name').required = (mode === 'register');
      document.getElementById('authSubmitBtn').textContent = mode === 'login' ? '登入開始練習' : '完成登記並進入練習';
      hideMsg('authMsg');
    }

    async function apiCall(payload) {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function submitAuth(e) {
      e.preventDefault();
      hideMsg('authMsg');
      const btn = document.getElementById('authSubmitBtn');
      btn.disabled = true;
      btn.textContent = '驗證中...';

      const payload = {
        action: authMode,
        account: document.getElementById('account').value.trim(),
        password: document.getElementById('password').value
      };
      if (authMode === 'register') payload.name = document.getElementById('name').value.trim();

      try {
        const data = await apiCall(payload);
        if (!data.ok) {
          showMsg('authMsg', data.message || '驗證失敗', 'error');
        } else {
          sessionStorage.setItem('ipas_token', data.token);
          enterApp(data.user);
        }
      } catch (err) {
        showMsg('authMsg', '無法連線至伺服器，請確認 GAS 網址設定正確。', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === 'login' ? '登入開始練習' : '完成登記並進入練習';
      }
    }

    async function restoreSession(token) {
      try {
        const data = await apiCall({ action: 'status', token });
        if (data.ok) enterApp(data.user);
        else sessionStorage.removeItem('ipas_token');
      } catch (err) {
        sessionStorage.removeItem('ipas_token');
      }
    }

    async function logout() {
      const token = sessionStorage.getItem('ipas_token');
      sessionStorage.removeItem('ipas_token');
      currentUser = null;
      document.getElementById('appView').classList.add('hidden');
      document.getElementById('userHeader').classList.add('hidden');
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('password').value = '';
      if (token) { try { await apiCall({ action: 'logout', token }); } catch (e) {} }
    }

    function enterApp(user) {
      currentUser = user;
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');
      document.getElementById('userHeader').classList.remove('hidden');
      document.getElementById('userBadge').textContent = `${user.name}（${user.account}）`;
      renderDashboard();
    }

    function getQuestionsForDay(day) {
      const padded = String(day).padStart(2, '0');
      const matched = allQuestions.filter(q => q.id && q.id.includes(`_d${padded}_`));
      return matched.length === 5 ? matched : allQuestions.slice((day - 1) * 5, day * 5);
    }

    function renderDashboard() {
      const u = currentUser;
      const unlockedDays = Math.min(u.currentDay - 1, u.totalDays);
      const randomRecs = u.history.filter(h => h.mode === 'random20').reverse();

      document.getElementById('statDone').textContent = `${unlockedDays} / ${u.totalDays}`;
      document.getElementById('statRandomCount').textContent = `${randomRecs.length} 次`;

      if (u.history.length > 0) {
        const totalCorrect = u.history.reduce((s, h) => s + h.correctCount, 0);
        const totalQ = u.history.reduce((s, h) => s + h.totalCount, 0);
        document.getElementById('statAcc').textContent = `${Math.round((totalCorrect / totalQ) * 100)}%`;
      } else {
        document.getElementById('statAcc').textContent = '--%';
      }

      // 主操作按鈕區
      const actionArea = document.getElementById('mainActionArea');
      let dailyBtnHtml = '';
      if (u.allCompleted) {
        document.getElementById('statStatus').textContent = '40 天完賽！';
        dailyBtnHtml = `<p style="margin:0;">🎉 恭喜完成全部 40 天進度！你可以隨時點擊下方進度牆重複練習，或挑戰隨機 20 題大測驗。</p>`;
      } else if (u.practicedToday) {
        const latestDay = u.currentDay - 1;
        document.getElementById('statStatus').textContent = '今日已完成';
        dailyBtnHtml = `
          <p style="margin:0;">今日 <strong>Day ${latestDay}</strong> 新進度已完成！明天可解鎖 Day ${u.currentDay}。</p>
          <div class="btn-row">
            <button class="btn" onclick="startQuiz('retry', ${latestDay})">🔄 重複練習 Day ${latestDay}</button>
            <button class="btn btn-accent" onclick="startQuiz('random20', 0)">🎲 隨機 20 題大測驗</button>
          </div>`;
      } else {
        document.getElementById('statStatus').textContent = `待完成 Day ${u.currentDay}`;
        dailyBtnHtml = `
          <p style="margin:0;">今日新進度：<strong>Day ${u.currentDay}</strong>（共 5 題）。</p>
          <div class="btn-row">
            <button class="btn" onclick="startQuiz('daily', ${u.currentDay})">✏️ 開始 Day ${u.currentDay} 練習</button>
            <button class="btn btn-accent" onclick="startQuiz('random20', 0)">🎲 隨機 20 題大測驗</button>
          </div>`;
      }
      if (u.allCompleted) {
        dailyBtnHtml += `<div class="btn-row"><button class="btn btn-accent" onclick="startQuiz('random20', 0)">🎲 隨機 20 題大測驗</button></div>`;
      }
      actionArea.innerHTML = dailyBtnHtml;

      // 渲染 40 天進度牆（取每一天最新一次成績）
      const latestDayMap = {};
      u.history.filter(h => h.mode !== 'random20' && h.day > 0).forEach(h => {
        latestDayMap[h.day] = h;
      });
      let gridHtml = '';
      for (let d = 1; d <= u.totalDays; d++) {
        const rec = latestDayMap[d];
        if (rec) {
          gridHtml += `<div class="day-chip done" onclick="openDayReview(${d})" title="點擊看詳解或重練">Day ${d}<br>${rec.score}分</div>`;
        } else {
          gridHtml += `<div class="day-chip">Day ${d}<br>未解鎖</div>`;
        }
      }
      document.getElementById('historyGrid').innerHTML = gridHtml;

      // 渲染錯題排行榜
      const topWrong = u.topWrong || [];
      const weakBox = document.getElementById('weaknessList');
      const revAllBtn = document.getElementById('reviewAllWrongBtn');
      if (topWrong.length === 0) {
        weakBox.innerHTML = '尚無錯題紀錄，繼續保持！';
        revAllBtn.classList.add('hidden');
      } else {
        revAllBtn.classList.remove('hidden');
        weakBox.innerHTML = topWrong.slice(0, 8).map((item, i) => {
          const q = qMap[item.id];
          const text = q ? q.text : item.id;
          return `
            <div class="list-item">
              <div style="flex:1;min-width:200px;">
                <strong>#${i + 1}</strong> ${escapeHtml(text)}
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="err-pill">錯 ${item.count} 次</span>
                <button class="btn btn-outline btn-sm" onclick="openSingleQuestionReview('${item.id}')">看解析</button>
              </div>
            </div>`;
        }).join('');
      }

      // 渲染隨機 20 題歷史紀錄
      const randBox = document.getElementById('randomHistoryList');
      if (randomRecs.length === 0) {
        randBox.innerHTML = '尚未進行過隨機 20 題大測驗，點擊上方「🎲 隨機 20 題大測驗」立即挑戰！';
      } else {
        randBox.innerHTML = randomRecs.slice(0, 10).map((rec, idx) => `
          <div class="list-item">
            <div>
              <strong>第 ${randomRecs.length - idx} 次大測驗</strong>
              <span style="color:var(--muted);font-size:0.88rem;margin-left:8px;">${rec.timestamp}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="badge">${rec.correctCount} / ${rec.totalCount} 題（${rec.score} 分）</span>
              <button class="btn btn-outline btn-sm" onclick="openRecordReview('${rec.id}')">看詳解</button>
            </div>
          </div>
        `).join('');
      }
    }

    function startQuiz(mode, day) {
      hideMsg('appMsg');
      activeQuizMode = mode;
      activeQuizDay = day;
      reviewedDay = 0;

      if (mode === 'random20') {
        const shuffled = [...allQuestions];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        activeQuestions = shuffled.slice(0, 20);
        document.getElementById('quizTitle').textContent = '🎲 隨機 20 題大測驗';
      } else {
        activeQuestions = getQuestionsForDay(day);
        const tag = mode === 'retry' ? '（重複練習）' : '（今日進度）';
        document.getElementById('quizTitle').textContent = `Day ${day} 每日 5 題${tag}`;
      }

      document.getElementById('retryFromReviewBtn').classList.add('hidden');
      document.getElementById('submitQuizBtn').classList.remove('hidden');
      document.getElementById('submitQuizBtn').disabled = false;
      document.getElementById('submitQuizBtn').textContent = '交卷並儲存成績';

      document.getElementById('quizQuestions').innerHTML = activeQuestions.map((q, idx) => `
        <div class="q-block">
          <div class="q-title">${idx + 1}. ${escapeHtml(q.text)}</div>
          ${Object.entries(q.options).map(([key, val]) => `
            <label class="opt-label">
              <input type="radio" name="ans_${q.id}" value="${key}" />
              <span><strong>${key}.</strong> ${escapeHtml(val)}</span>
            </label>
          `).join('')}
        </div>
      `).join('');

      document.getElementById('quizCard').classList.remove('hidden');
      document.getElementById('quizCard').scrollIntoView({ behavior: 'smooth' });
    }

    async function submitQuiz() {
      const answers = {};
      for (const q of activeQuestions) {
        const checked = document.querySelector(`input[name="ans_${q.id}"]:checked`);
        if (!checked) {
          showMsg('appMsg', `還有題目尚未作答，請完成全部 ${activeQuestions.length} 題後再交卷！`, 'error');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        answers[q.id] = checked.value;
      }

      let correctCount = 0;
      const wrongIds = [];
      activeQuestions.forEach(q => {
        if (answers[q.id] === q.answer) correctCount++;
        else wrongIds.push(q.id);
      });

      const btn = document.getElementById('submitQuizBtn');
      btn.disabled = true;
      btn.textContent = '成績儲存中...';

      try {
        const token = sessionStorage.getItem('ipas_token');
        const data = await apiCall({
          action: 'submit',
          token,
          mode: activeQuizMode,
          day: activeQuizDay,
          correctCount,
          totalCount: activeQuestions.length,
          wrongIds,
          answers
        });

        if (!data.ok) {
          if (data.code === 'UNAUTHORIZED') { alert('登入已逾時，請重新登入。'); logout(); return; }
          showMsg('appMsg', data.message || '儲存失敗', 'error');
          btn.disabled = false;
          btn.textContent = '交卷並儲存成績';
          return;
        }

        currentUser = data.user;
        renderDashboard();
        const latestRec = currentUser.history[currentUser.history.length - 1];
        showMsg('appMsg', `測驗完成並已儲存！本次答對 ${correctCount} / ${activeQuestions.length} 題（${latestRec.score} 分）。`, 'success');
        openRecordReview(latestRec.id);
      } catch (err) {
        showMsg('appMsg', '網路連線失敗，請再試一次。', 'error');
        btn.disabled = false;
        btn.textContent = '交卷並儲存成績';
      }
    }

    function openDayReview(day) {
      const recs = currentUser.history.filter(h => h.mode !== 'random20' && h.day === day);
      if (recs.length === 0) return;
      const latest = recs[recs.length - 1];
      openRecordReview(latest.id);
    }

    function openRecordReview(recId) {
      const rec = currentUser.history.find(h => h.id === recId);
      if (!rec) return;

      let questions = [];
      if (rec.mode === 'random20') {
        reviewedDay = 0;
        questions = Object.keys(rec.answers || {}).map(id => qMap[id]).filter(Boolean);
        document.getElementById('quizTitle').textContent = `🎲 隨機 20 題詳解（${rec.score} 分｜${rec.timestamp}）`;
        document.getElementById('retryFromReviewBtn').classList.add('hidden');
      } else {
        reviewedDay = rec.day;
        questions = getQuestionsForDay(rec.day);
        document.getElementById('quizTitle').textContent = `Day ${rec.day} 詳解（最新得分：${rec.score} 分｜${rec.date}）`;
        document.getElementById('retryFromReviewBtn').classList.remove('hidden');
      }

      renderReviewQuestions(questions, rec.answers || {});
    }

    function retryReviewedDay() {
      if (reviewedDay > 0) startQuiz('retry', reviewedDay);
    }

    function openSingleQuestionReview(qId) {
      const q = qMap[qId];
      if (!q) return;
      reviewedDay = 0;
      document.getElementById('quizTitle').textContent = '🎯 錯題詳解複習';
      document.getElementById('retryFromReviewBtn').classList.add('hidden');
      renderReviewQuestions([q], {});
    }

    function openWeaknessReview() {
      const qs = (currentUser.topWrong || []).slice(0, 10).map(item => qMap[item.id]).filter(Boolean);
      if (qs.length === 0) return;
      reviewedDay = 0;
      document.getElementById('quizTitle').textContent = `🎯 我的 TOP ${qs.length} 最易錯題目總複習`;
      document.getElementById('retryFromReviewBtn').classList.add('hidden');
      renderReviewQuestions(qs, {});
    }

    function renderReviewQuestions(questions, userAnswers) {
      document.getElementById('submitQuizBtn').classList.add('hidden');
      document.getElementById('quizQuestions').innerHTML = questions.map((q, idx) => {
        const userAns = userAnswers[q.id] || null;
        return `
          <div class="q-block">
            <div class="q-title">${idx + 1}. ${escapeHtml(q.text)}</div>
            ${Object.entries(q.options).map(([key, val]) => {
              let cls = 'opt-label';
              if (key === q.answer) cls += ' opt-correct';
              else if (userAns && key === userAns && userAns !== q.answer) cls += ' opt-wrong';
              const tag = key === q.answer ? ' ✅ 正確答案' : (key === userAns ? ' ❌ 你的作答' : '');
              return `<div class="${cls}" style="cursor:default;"><span><strong>${key}.</strong> ${escapeHtml(val)}<strong>${tag}</strong></span></div>`;
            }).join('')}
            <div class="explanation"><strong>解析：</strong>${escapeHtml(q.explanation)}</div>
          </div>
        `;
      }).join('');

      document.getElementById('quizCard').classList.remove('hidden');
      document.getElementById('quizCard').scrollIntoView({ behavior: 'smooth' });
    }

    function closeQuizCard() {
      document.getElementById('quizCard').classList.add('hidden');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = `msg ${type}`;
    }
    function hideMsg(id) { document.getElementById(id).className = 'msg'; }
    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
