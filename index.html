<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPAS AI 應用規劃師｜每日 5 題練習系統</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 780px; margin: 0 auto; padding: 20px 16px 60px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }
    h1, h2, h3 { margin-top: 0; }
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; margin-bottom: 18px;
    }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 600; background: #dbeafe; color: #1e40af;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab-btn {
      flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
      background: #f8fafc; cursor: pointer; font-weight: 600; font-size: 1rem;
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 1rem;
    }
    .btn {
      display: inline-block; padding: 11px 20px; border: none; border-radius: 8px;
      background: var(--primary); color: #fff; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: 0.15s;
    }
    .btn:hover:not(:disabled) { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-outline {
      background: #fff; color: var(--text); border: 1px solid var(--border);
    }
    .btn-outline:hover:not(:disabled) { background: #f8fafc; }
    .btn-full { width: 100%; }
    .msg {
      padding: 10px 14px; border-radius: 8px; margin-bottom: 14px;
      font-size: 0.95rem; display: none;
    }
    .msg.error { display: block; background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; }
    .msg.success { display: block; background: var(--success-bg); color: var(--success); border: 1px solid #bbf7d0; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px;
    }
    .stat-box {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; text-align: center;
    }
    .stat-num { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 0.85rem; color: var(--muted); }
    .q-block {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; margin-bottom: 16px; background: #fff;
    }
    .q-title { font-weight: 700; margin-bottom: 12px; font-size: 1.05rem; }
    .opt-label {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 8px; cursor: pointer; transition: 0.12s;
    }
    .opt-label:hover { background: #f8fafc; }
    .opt-label input { width: auto; margin-top: 4px; }
    .opt-correct { background: var(--success-bg) !important; border-color: var(--success) !important; }
    .opt-wrong { background: var(--danger-bg) !important; border-color: var(--danger) !important; }
    .explanation {
      margin-top: 10px; padding: 12px; border-radius: 8px;
      background: #f8fafc; border-left: 4px solid var(--primary); font-size: 0.94rem;
    }
    .history-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px;
    }
    .day-chip {
      padding: 8px 4px; text-align: center; border-radius: 8px; font-size: 0.85rem;
      border: 1px solid var(--border); background: #f8fafc; color: var(--muted);
    }
    .day-chip.done {
      background: var(--success-bg); border-color: #86efac; color: #166534;
      font-weight: 600; cursor: pointer;
    }
    .day-chip.done:hover { filter: brightness(0.95); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div>
        <h2 style="margin:0;">iPAS AI 應用規劃師｜每日 5 題練習</h2>
        <span style="font-size:0.9rem;color:var(--muted);">40 天 200 題養成計畫・個人紀錄安全加密儲存</span>
      </div>
      <div id="userHeader" class="hidden" style="display:flex;align-items:center;gap:10px;">
        <span id="userBadge" class="badge"></span>
        <button class="btn btn-outline" style="padding:6px 12px;font-size:0.9rem;" onclick="logout()">登出</button>
      </div>
    </div>

    <!-- 登入 / 登記畫面 -->
    <div id="authView" class="card">
      <div class="tabs">
        <button id="tabLogin" class="tab-btn active" onclick="switchAuthTab('login')">考生登入</button>
        <button id="tabRegister" class="tab-btn" onclick="switchAuthTab('register')">新考生登記</button>
      </div>
      <div id="authMsg" class="msg"></div>

      <form id="authForm" onsubmit="submitAuth(event)">
        <div class="form-group">
          <label for="account">帳號（Email 或學號）</label>
          <input id="account" type="text" required placeholder="例如：student01@example.com" autocomplete="username" />
        </div>
        <div id="nameGroup" class="form-group hidden">
          <label for="name">考生姓名 / 暱稱</label>
          <input id="name" type="text" placeholder="請輸入姓名" />
        </div>
        <div class="form-group">
          <label for="password">密碼（至少 6 碼）</label>
          <input id="password" type="password" required minlength="6" placeholder="請輸入密碼" autocomplete="current-password" />
        </div>
        <button id="authSubmitBtn" type="submit" class="btn btn-full">登入開始練習</button>
      </form>
    </div>

    <!-- 主畫面 -->
    <div id="appView" class="hidden">
      <div class="card">
        <div class="stats-grid">
          <div class="stat-box">
            <div id="statDone" class="stat-num">0 / 40</div>
            <div class="stat-label">已完成天數</div>
          </div>
          <div class="stat-box">
            <div id="statAcc" class="stat-num">--%</div>
            <div class="stat-label">累計正確率</div>
          </div>
          <div class="stat-box">
            <div id="statStatus" class="stat-num" style="font-size:1.15rem;">載入中</div>
            <div class="stat-label">今日狀態</div>
          </div>
        </div>
        <div id="appMsg" class="msg"></div>
        <div id="mainActionArea"></div>
      </div>

      <!-- 練習區 / 複習區 -->
      <div id="quizCard" class="card hidden">
        <div class="header-bar" style="margin-bottom:12px;">
          <h3 id="quizTitle" style="margin:0;"></h3>
          <button id="closeReviewBtn" class="btn btn-outline hidden" style="padding:6px 12px;font-size:0.9rem;" onclick="closeQuizCard()">返回總覽</button>
        </div>
        <div id="quizQuestions"></div>
        <button id="submitQuizBtn" class="btn btn-full hidden" onclick="submitQuiz()">交卷並儲存今日紀錄</button>
      </div>

      <!-- 40 天進度牆 -->
      <div class="card">
        <h3>40 天練習紀錄牆（點擊已完成天數可複習詳解）</h3>
        <div id="historyGrid" class="history-grid"></div>
      </div>
    </div>
  </div>

  <script>
    // ====== 請替換成你在步驟一部署的 Google Apps Script 網址 ======
    const GAS_WEB_APP_URL = '貼上你的_GAS_網頁應用程式網址';
    // ===============================================================

    let authMode = 'login';
    let allQuestions = [];
    let currentUser = null;
    let activeQuizDay = null;
    let activeQuestions = [];

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('./ipas_ai_40days_200q.json');
        if (!res.ok) throw new Error('無法載入題庫檔案');
        allQuestions = await res.json();
      } catch (err) {
        showMsg('authMsg', '題庫載入失敗，請確認 ipas_ai_40days_200q.json 已與 index.html 放在同一目錄。', 'error');
        return;
      }

      const savedToken = sessionStorage.getItem('ipas_token');
      if (savedToken) {
        await restoreSession(savedToken);
      }
    });

    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('nameGroup').classList.toggle('hidden', mode === 'login');
      document.getElementById('name').required = (mode === 'register');
      document.getElementById('authSubmitBtn').textContent = mode === 'login' ? '登入開始練習' : '完成登記並進入練習';
      hideMsg('authMsg');
    }

    async function apiCall(payload) {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function submitAuth(e) {
      e.preventDefault();
      hideMsg('authMsg');
      const btn = document.getElementById('authSubmitBtn');
      btn.disabled = true;
      btn.textContent = '驗證中...';

      const payload = {
        action: authMode,
        account: document.getElementById('account').value.trim(),
        password: document.getElementById('password').value
      };
      if (authMode === 'register') {
        payload.name = document.getElementById('name').value.trim();
      }

      try {
        const data = await apiCall(payload);
        if (!data.ok) {
          showMsg('authMsg', data.message || '驗證失敗', 'error');
        } else {
          sessionStorage.setItem('ipas_token', data.token);
          enterApp(data.user);
        }
      } catch (err) {
        showMsg('authMsg', '無法連線至伺服器，請確認 GAS 網址設定正確。', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === 'login' ? '登入開始練習' : '完成登記並進入練習';
      }
    }

    async function restoreSession(token) {
      try {
        const data = await apiCall({ action: 'status', token });
        if (data.ok) {
          enterApp(data.user);
        } else {
          sessionStorage.removeItem('ipas_token');
        }
      } catch (err) {
        sessionStorage.removeItem('ipas_token');
      }
    }

    async function logout() {
      const token = sessionStorage.getItem('ipas_token');
      sessionStorage.removeItem('ipas_token');
      currentUser = null;
      document.getElementById('appView').classList.add('hidden');
      document.getElementById('userHeader').classList.add('hidden');
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('password').value = '';
      if (token) {
        try { await apiCall({ action: 'logout', token }); } catch (e) {}
      }
    }

    function enterApp(user) {
      currentUser = user;
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');
      document.getElementById('userHeader').classList.remove('hidden');
      document.getElementById('userBadge').textContent = `${user.name}（${user.account}）`;
      renderDashboard();
    }

    function getQuestionsForDay(day) {
      const padded = String(day).padStart(2, '0');
      const matched = allQuestions.filter(q => q.id && q.id.includes(`_d${padded}_`));
      if (matched.length === 5) return matched;
      return allQuestions.slice((day - 1) * 5, day * 5);
    }

    function renderDashboard() {
      const u = currentUser;
      const doneCount = u.history.length;
      document.getElementById('statDone').textContent = `${doneCount} / ${u.totalDays}`;

      if (doneCount > 0) {
        const totalCorrect = u.history.reduce((sum, h) => sum + h.correctCount, 0);
        const acc = Math.round((totalCorrect / (doneCount * 5)) * 100);
        document.getElementById('statAcc').textContent = `${acc}%`;
      } else {
        document.getElementById('statAcc').textContent = '--%';
      }

      const actionArea = document.getElementById('mainActionArea');
      if (u.allCompleted) {
        document.getElementById('statStatus').textContent = '全數完成';
        actionArea.innerHTML = `<p style="margin:0;font-weight:600;color:var(--success);">恭喜完成全部 40 天 200 題練習！你可以隨時點擊下方紀錄牆複習詳解。</p>`;
      } else if (u.practicedToday) {
        document.getElementById('statStatus').textContent = '今日已完成';
        const lastRec = u.history[u.history.length - 1];
        actionArea.innerHTML = `
          <p style="margin:0 0 12px;">你今天已完成 <strong>Day ${lastRec.day}</strong>（答對 ${lastRec.correctCount} / 5 題，${lastRec.score} 分）。明天登入即可解鎖 <strong>Day ${u.currentDay}</strong>！</p>
          <button class="btn btn-outline" onclick="openReview(${lastRec.day})">檢視今日 5 題詳解</button>
        `;
      } else {
        document.getElementById('statStatus').textContent = `待完成 Day ${u.currentDay}`;
        actionArea.innerHTML = `
          <p style="margin:0 0 12px;">今日進度：<strong>Day ${u.currentDay}</strong>（共 5 題）。準備好了就開始吧！</p>
          <button class="btn" onclick="startDailyQuiz(${u.currentDay})">開始 Day ${u.currentDay} 練習</button>
        `;
      }

      // 渲染 40 天紀錄牆
      const grid = document.getElementById('historyGrid');
      const doneMap = {};
      u.history.forEach(h => { doneMap[h.day] = h; });
      let html = '';
      for (let d = 1; d <= u.totalDays; d++) {
        const rec = doneMap[d];
        if (rec) {
          html += `<div class="day-chip done" onclick="openReview(${d})" title="點擊複習 Day ${d}">Day ${d}<br>${rec.score}分</div>`;
        } else {
          html += `<div class="day-chip">Day ${d}<br>未完成</div>`;
        }
      }
      grid.innerHTML = html;
    }

    function startDailyQuiz(day) {
      hideMsg('appMsg');
      activeQuizDay = day;
      activeQuestions = getQuestionsForDay(day);

      document.getElementById('quizTitle').textContent = `Day ${day} 每日練習（共 ${activeQuestions.length} 題）`;
      document.getElementById('closeReviewBtn').classList.add('hidden');
      document.getElementById('submitQuizBtn').classList.remove('hidden');
      document.getElementById('submitQuizBtn').disabled = false;
      document.getElementById('submitQuizBtn').textContent = '交卷並儲存今日紀錄';

      const box = document.getElementById('quizQuestions');
      box.innerHTML = activeQuestions.map((q, idx) => `
        <div class="q-block" id="qblock_${q.id}">
          <div class="q-title">${idx + 1}. ${escapeHtml(q.text)}</div>
          ${Object.entries(q.options).map(([key, val]) => `
            <label class="opt-label">
              <input type="radio" name="ans_${q.id}" value="${key}" />
              <span><strong>${key}.</strong> ${escapeHtml(val)}</span>
            </label>
          `).join('')}
        </div>
      `).join('');

      document.getElementById('quizCard').classList.remove('hidden');
      document.getElementById('quizCard').scrollIntoView({ behavior: 'smooth' });
    }

    async function submitQuiz() {
      const answers = {};
      for (const q of activeQuestions) {
        const checked = document.querySelector(`input[name="ans_${q.id}"]:checked`);
        if (!checked) {
          showMsg('appMsg', '還有題目尚未作答，請完成全部 5 題後再交卷！', 'error');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        answers[q.id] = checked.value;
      }

      let correctCount = 0;
      const wrongIds = [];
      activeQuestions.forEach(q => {
        if (answers[q.id] === q.answer) correctCount++;
        else wrongIds.push(q.id);
      });

      const btn = document.getElementById('submitQuizBtn');
      btn.disabled = true;
      btn.textContent = '紀錄儲存中...';

      try {
        const token = sessionStorage.getItem('ipas_token');
        const data = await apiCall({
          action: 'submit',
          token,
          day: activeQuizDay,
          correctCount,
          totalCount: activeQuestions.length,
          wrongIds,
          answers
        });

        if (!data.ok) {
          if (data.code === 'UNAUTHORIZED') {
            alert('登入已逾時，請重新登入。');
            logout();
            return;
          }
          showMsg('appMsg', data.message || '儲存失敗', 'error');
          btn.disabled = false;
          btn.textContent = '交卷並儲存今日紀錄';
          return;
        }

        currentUser = data.user;
        renderDashboard();
        showMsg('appMsg', `Day ${activeQuizDay} 已完成並儲存！本次答對 ${correctCount} / ${activeQuestions.length} 題。`, 'success');
        openReview(activeQuizDay);
      } catch (err) {
        showMsg('appMsg', '網路連線失敗，請再試一次。', 'error');
        btn.disabled = false;
        btn.textContent = '交卷並儲存今日紀錄';
      }
    }

    function openReview(day) {
      const rec = currentUser.history.find(h => h.day === day);
      if (!rec) return;
      const questions = getQuestionsForDay(day);

      document.getElementById('quizTitle').textContent = `Day ${day} 詳解複習（得分：${rec.score} 分｜${rec.date}）`;
      document.getElementById('closeReviewBtn').classList.remove('hidden');
      document.getElementById('submitQuizBtn').classList.add('hidden');

      const box = document.getElementById('quizQuestions');
      box.innerHTML = questions.map((q, idx) => {
        const userAns = rec.answers ? rec.answers[q.id] : null;
        return `
          <div class="q-block">
            <div class="q-title">${idx + 1}. ${escapeHtml(q.text)}</div>
            ${Object.entries(q.options).map(([key, val]) => {
              let cls = 'opt-label';
              if (key === q.answer) cls += ' opt-correct';
              else if (userAns && key === userAns && userAns !== q.answer) cls += ' opt-wrong';
              const tag = key === q.answer ? '（正確答案）' : (key === userAns ? '（你的作答）' : '');
              return `<div class="${cls}" style="cursor:default;"><span><strong>${key}.</strong> ${escapeHtml(val)} <strong>${tag}</strong></span></div>`;
            }).join('')}
            <div class="explanation"><strong>解析：</strong>${escapeHtml(q.explanation)}</div>
          </div>
        `;
      }).join('');

      document.getElementById('quizCard').classList.remove('hidden');
      document.getElementById('quizCard').scrollIntoView({ behavior: 'smooth' });
    }

    function closeQuizCard() {
      document.getElementById('quizCard').classList.add('hidden');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = `msg ${type}`;
    }

    function hideMsg(id) {
      const el = document.getElementById(id);
      el.className = 'msg';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
